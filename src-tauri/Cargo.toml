[package]
name = "helium-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }

# Cryptography
argon2 = { version = "0.5", features = ["std", "alloc"] }
pqcrypto = "0.18"
pqcrypto-traits = "0.3"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
base64 = "0.22"

# Error handling
anyhow = "1"
thiserror = "1"

# Storage
dirs = "5"
once_cell = "1"

# Global Shortcuts
tauri-plugin-global-shortcut = "2"
libc = "0.2.186"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
